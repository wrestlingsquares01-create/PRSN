<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRSN ADMIN</title>

    <link rel="stylesheet" href="admin.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="background">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="grid"></div>
</div>


<!-- LOGIN -->

<section id="loginScreen" class="login-screen">

    <div class="login-card">

        <div class="mini-logo">PRSN</div>

        <div class="admin-label">
            ADMIN ACCESS
        </div>

        <h1>Welcome Back</h1>

        <p>Private administration panel</p>

        <input
            type="text"
            id="adminUsername"
            placeholder="Admin username"
            autocomplete="off"
        >

        <input
            type="password"
            id="adminPassword"
            placeholder="Admin password"
        >

        <button id="loginBtn">
            ENTER ADMIN
        </button>

        <div id="loginError" class="error"></div>

    </div>

</section>


<!-- ADMIN DASHBOARD -->

<section id="adminPanel" class="admin-panel hidden">

    <header class="topbar">

        <div>
            <div class="brand">PRSN</div>
            <div class="brand-sub">ADMIN CONTROL</div>
        </div>

        <button id="logoutBtn" class="logout-btn">
            LOGOUT
        </button>

    </header>


    <main class="dashboard">

        <div class="welcome">
            <span>CONTROL CENTER</span>
            <h1>PRSN ADMIN</h1>
        </div>


        <!-- STATS -->

        <div class="stats-grid">

            <div class="stat-card">
                <span>👥</span>
                <small>MEMBERS</small>
                <strong id="memberCount">0</strong>
            </div>

            <div class="stat-card">
                <span>💬</span>
                <small>MESSAGES</small>
                <strong id="messageCount">0</strong>
            </div>

            <div class="stat-card">
                <span>🖼️</span>
                <small>PHOTOS</small>
                <strong id="photoCount">0</strong>
            </div>

            <div class="stat-card">
                <span>🎙️</span>
                <small>VOICES</small>
                <strong id="voiceCount">0</strong>
            </div>

        </div>


        <!-- MEMBERS -->

        <section class="panel-card">

            <div class="section-title">
                <div>
                    <small>COMMUNITY</small>
                    <h2>Members</h2>
                </div>

                <button id="refreshBtn">
                    ↻ REFRESH
                </button>
            </div>

            <div id="membersList" class="members-list"></div>

        </section>


        <!-- RECENT MESSAGES -->

        <section class="panel-card">

            <div class="section-title">
                <div>
                    <small>CHAT</small>
                    <h2>Recent Messages</h2>
                </div>
            </div>

            <div id="messagesList" class="messages-list"></div>

        </section>


        <!-- GALLERY -->

        <section class="panel-card">

            <div class="section-title">
                <div>
                    <small>MEDIA</small>
                    <h2>Amazing Wall</h2>
                </div>
            </div>

            <div id="galleryList" class="gallery-list"></div>

        </section>

    </main>

</section>


<script src="admin.js"></script>

</body>
</html>
