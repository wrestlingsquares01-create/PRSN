<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PRSN</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >
</head>


<body>

    <!-- ========================================= -->
    <!-- BACKGROUND -->
    <!-- ========================================= -->

    <div class="background">

        <div class="grid"></div>

        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

    </div>


    <!-- ========================================= -->
    <!-- MUSIC -->
    <!-- ========================================= -->

    <audio
        id="bgMusic"
        loop
    >
        <source
            src="song.mp3"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="chatMusic"
        loop
    >
        <source
            src="song2.mp3"
            type="audio/mpeg"
        >
    </audio>


    <!-- ========================================= -->
    <!-- NAME SCREEN -->
    <!-- ========================================= -->

    <section
        id="nameScreen"
        class="screen active"
    >

        <div class="login-card glass-card">

            <div class="logo">
                PRSN
            </div>

            <div class="tagline">
                PRIVATE • REAL • SIMPLE • NOW
            </div>


            <div class="divider"></div>


            <h1>
                Welcome.
            </h1>

            <p class="muted">
                Enter your name to enter PRSN.
            </p>


            <input
                type="text"
                id="nameInput"
                placeholder="Your name"
                autocomplete="off"
            >


            <button
                id="enterBtn"
                class="primary-btn"
            >
                ENTER PRSN
            </button>


            <div
                id="nameError"
                class="error"
            ></div>

        </div>

    </section>


    <!-- ========================================= -->
    <!-- DASHBOARD -->
    <!-- ========================================= -->

    <section
        id="dashboard"
        class="screen"
    >

        <!-- TOP BAR -->

        <header class="topbar">

            <div class="brand">
                PRSN
            </div>


            <div class="top-right">

                <span id="currentUser"></span>

                <button
                    id="musicBtn"
                    class="icon-btn"
                    title="Music"
                >
                    ♫
                </button>

            </div>

        </header>


        <!-- DASHBOARD CONTENT -->

        <main class="dashboard-content">

            <div class="welcome-section">

                <div class="small-label">
                    PRIVATE COMMUNITY
                </div>

                <h1>
                    Welcome,
                    <span id="welcomeUser">
                    </span>
                </h1>

                <p>
                    This is your PRSN space.
                </p>

            </div>


            <!-- ================================= -->
            <!-- COMMUNITY CHAT -->
            <!-- ================================= -->

            <button
                id="chatBtn"
                class="feature-card chat-main-card"
            >

                <div class="feature-icon">
                    💬
                </div>

                <div class="feature-title">
                    Community Chat
                </div>

                <div class="feature-description">
                    Enter the private PRSN chat and talk in realtime.
                </div>

                <div class="feature-arrow">
                    →
                </div>

            </button>


            <!-- ================================= -->
            <!-- AMAZING WALL -->
            <!-- ================================= -->

            <button
                id="galleryBtn"
                class="feature-card gallery-main-card"
            >

                <div class="feature-icon">
                    📸
                </div>

                <div class="feature-title">
                    Amazing Wall
                </div>

                <div class="feature-description">
                    Got an amazing photo? Put it on the PRSN wall.
                </div>

                <div class="feature-arrow">
                    →
                </div>

            </button>

        </main>

    </section>


    <!-- ========================================= -->
    <!-- CHAT CODE MODAL -->
    <!-- ========================================= -->

    <div
        id="chatModal"
        class="modal hidden"
    >

        <div class="modal-box">

            <button
                id="closeChat"
                class="close-btn"
            >
                ×
            </button>


            <div class="modal-icon">
                🔐
            </div>


            <h2>
                Private Chat
            </h2>


            <p>
                Enter the PRSN chat codeword.
            </p>


            <input
                type="password"
                id="chatCode"
                placeholder="Codeword"
                autocomplete="off"
            >


            <button
                id="unlockChat"
                class="primary-btn"
            >
                UNLOCK CHAT
            </button>


            <div
                id="chatError"
                class="error"
            ></div>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- CHAT NAME MODAL -->
    <!-- ========================================= -->

    <div
        id="chatNameModal"
        class="modal hidden"
    >

        <div class="modal-box">

            <div class="modal-icon">
                👤
            </div>


            <h2>
                Chat Name
            </h2>


            <p>
                Ye naam chat mein dikhega.
            </p>


            <input
                type="text"
                id="chatNameInput"
                placeholder="Enter chat name"
                autocomplete="off"
            >


            <button
                id="enterCommunity"
                class="primary-btn"
            >
                ENTER CHAT
            </button>


            <div
                id="chatNameError"
                class="error"
            ></div>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- AMAZING WALL -->
    <!-- ========================================= -->

    <section
        id="galleryScreen"
        class="full-panel hidden"
    >

        <!-- HEADER -->

        <div class="panel-header">

            <button
                id="backFromGallery"
                class="back-btn"
            >
                ←
            </button>


            <div>

                <div class="panel-title">
                    AMAZING WALL
                </div>

                <div class="panel-subtitle">
                    PRSN • OUR BEST MOMENTS
                </div>

            </div>

        </div>


        <!-- UPLOAD BAR -->

        <div class="gallery-toolbar">

            <label
                for="galleryInput"
                class="gallery-upload-btn"
            >
                📸 UPLOAD PHOTO
            </label>


            <input
                type="file"
                id="galleryInput"
                accept="image/*"
                hidden
            >

        </div>


        <!-- GALLERY -->

        <div
            id="galleryGrid"
            class="gallery-grid"
        ></div>

    </section>


    <!-- ========================================= -->
    <!-- COMMUNITY CHAT -->
    <!-- ========================================= -->

    <section
        id="chatScreen"
        class="full-panel hidden"
    >

        <!-- CHAT HEADER -->

        <div class="panel-header">

            <button
                id="backFromChat"
                class="back-btn"
            >
                ←
            </button>


            <div>

                <div class="panel-title">
                    COMMUNITY CHAT
                </div>

                <div class="panel-subtitle">
                    PRSN • REALTIME
                </div>

            </div>

        </div>


        <!-- MESSAGES -->

        <div
            id="messages"
            class="messages"
        ></div>


        <!-- CHAT INPUT -->

        <div class="chat-input-area">

            <!-- PHOTO BUTTON -->

            <label
                for="photoInput"
                class="photo-btn"
                title="Send photo"
            >
                📷
            </label>


            <input
                type="file"
                id="photoInput"
                accept="image/*"
                hidden
            >


            <!-- TEXT -->

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
            >


            <!-- SEND -->

            <button
                id="sendMessage"
            >
                SEND
            </button>

        </div>

    </section>


    <!-- ========================================= -->
    <!-- SUPABASE -->
    <!-- ========================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- ========================================= -->
    <!-- YOUR JAVASCRIPT -->
    <!-- ========================================= -->

    <script
        src="script.js"
    ></script>

</body>

</html>
